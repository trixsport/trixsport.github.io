<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Your Path</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at center, #111 0%, #000 100%);
  color: white;
  overflow: hidden;
}

.container {
  text-align: center;
  width: 90%;
  max-width: 900px;
}

h1 {
  font-size: 42px;
  margin-bottom: 10px;
  letter-spacing: 2px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 50px;
  font-size: 16px;
}

.choices {
  display: flex;
  gap: 40px;
  justify-content: center;
}

.card {
  flex: 1;
  padding: 50px 30px;
  border-radius: 25px;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.1);
  transition: transform 0.25s, box-shadow 0.25s, border 0.25s;
  backdrop-filter: blur(10px);
}

.card:hover {
  transform: translateY(-10px) scale(1.03);
}

.red {
  background: linear-gradient(
    145deg,
    rgba(255,0,0,0.15),
    rgba(0,0,0,0.6)
  );
  box-shadow: 0 0 25px rgba(255,0,0,0.25);
}

.red:hover {
  box-shadow: 0 0 40px rgba(255,0,0,0.6);
  border: 1px solid rgba(255,0,0,0.4);
}

.blue {
  background: linear-gradient(
    145deg,
    rgba(0,150,255,0.15),
    rgba(0,0,0,0.6)
  );
  box-shadow: 0 0 25px rgba(0,150,255,0.25);
}

.blue:hover {
  box-shadow: 0 0 40px rgba(0,150,255,0.6);
  border: 1px solid rgba(0,150,255,0.4);
}

.card h2 {
  font-size: 34px;
  margin-bottom: 15px;
}

.card p {
  color: #ccc;
  font-size: 16px;
  line-height: 1.5;
}

.result {
  margin-top: 40px;
  font-size: 24px;
  font-weight: bold;
  color: #fff;
  text-shadow: 0 0 10px rgba(255,255,255,0.2);
}

.glow {
  position: absolute;
  width: 400px;
  height: 400px;
  filter: blur(120px);
  opacity: 0.2;
  z-index: -1;
}

.glow.red {
  background: red;
  top: 10%;
  left: 10%;
}

.glow.blue {
  background: blue;
  bottom: 10%;
  right: 10%;
}

@media (max-width: 700px) {
  .choices {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="glow red"></div>
<div class="glow blue"></div>

<div class="container">

<h1>CHOOSE YOUR PATH</h1>

<div class="subtitle">
  There is no going back once you decide.
</div>

<div class="choices">

  <div class="card red" onclick="choose('Red Pill')">
    <h2>🔴 RED PILL</h2>
    <p>
      Mystery choice, will involve physical activity
      and being outdoors the whole day.
    </p>
  </div>

  <div class="card blue" onclick="choose('Blue Pill')">
    <h2>🔵 BLUE PILL</h2>
    <p>
      LA La Land movie, chill, eat, watch movie,
      activity afterwards.
    </p>
  </div>

</div>

<div class="result" id="result"></div>

</div>

<script>
function choose(option) {
  if (option === "Red Pill") {
    document.getElementById("result").textContent =
      "🔴 You chose the Red Pill. Mystery awaits...";
  } else {
    document.getElementById("result").textContent =
      "🔵 You chose the Blue Pill. Movie time!";
  }
}
</script>

</body>
</html>
