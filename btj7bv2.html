<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Your Path</title>

<style>
* { box-sizing: border-box; }

:root {
  color-scheme: dark;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at center, #111 0%, #000 100%);
  color: white;
  overflow: hidden;
}

.container {
  position: relative;
  z-index: 1;
  text-align: center;
  width: min(900px, 100%);
}

h1 {
  font-size: clamp(32px, 6vw, 42px);
  margin: 0 0 10px;
  letter-spacing: 2px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 50px;
  font-size: 16px;
}

.choices {
  display: flex;
  gap: 40px;
  justify-content: center;
}

.card {
  flex: 1;
  min-width: 0;
  padding: 50px 30px;
  border-radius: 25px;
  cursor: pointer;
  color: inherit;
  font: inherit;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.1);
  transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s, opacity 0.25s;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.card:hover:not(:disabled),
.card:focus-visible:not(:disabled) {
  transform: translateY(-10px) scale(1.03);
  outline: none;
}

.card:disabled {
  cursor: not-allowed;
  opacity: 0.65;
}

.red {
  background: linear-gradient(145deg, rgba(255,0,0,0.15), rgba(0,0,0,0.6));
  box-shadow: 0 0 25px rgba(255,0,0,0.25);
}

.red:hover:not(:disabled),
.red:focus-visible:not(:disabled) {
  box-shadow: 0 0 40px rgba(255,0,0,0.6);
  border-color: rgba(255,0,0,0.4);
}

.blue {
  background: linear-gradient(145deg, rgba(0,150,255,0.15), rgba(0,0,0,0.6));
  box-shadow: 0 0 25px rgba(0,150,255,0.25);
}

.blue:hover:not(:disabled),
.blue:focus-visible:not(:disabled) {
  box-shadow: 0 0 40px rgba(0,150,255,0.6);
  border-color: rgba(0,150,255,0.4);
}

.card h2 {
  font-size: clamp(26px, 5vw, 34px);
  margin: 0 0 15px;
}

.card p {
  margin: 0;
  color: #ccc;
  font-size: 16px;
  line-height: 1.5;
}

.result {
  min-height: 30px;
  margin-top: 40px;
  font-size: 24px;
  font-weight: bold;
  color: #fff;
  text-shadow: 0 0 10px rgba(255,255,255,0.2);
}

.result.error {
  color: #ff8d8d;
}

.glow {
  position: fixed;
  width: 400px;
  height: 400px;
  filter: blur(120px);
  opacity: 0.2;
  z-index: 0;
  pointer-events: none;
}

.glow.red {
  background: red;
  top: 10%;
  left: 10%;
}

.glow.blue {
  background: blue;
  bottom: 10%;
  right: 10%;
}

@media (max-width: 700px) {
  body {
    overflow: auto;
  }

  .subtitle {
    margin-bottom: 30px;
  }

  .choices {
    flex-direction: column;
    gap: 20px;
  }

  .card {
    padding: 35px 24px;
  }
}
</style>
</head>

<body>

<div class="glow red"></div>
<div class="glow blue"></div>

<main class="container">
  <h1>CHOOSE YOUR PATH</h1>

  <div class="subtitle">
    There is no going back once you decide.
  </div>

  <div class="choices">
    <button class="card red" type="button" data-choice="Red Pill">
      <h2>🔴 RED PILL</h2>
      <p>
        Mystery choice, will involve physical activity
        and being outdoors the whole day.
      </p>
    </button>

    <button class="card blue" type="button" data-choice="Blue Pill">
      <h2>🔵 BLUE PILL</h2>
      <p>
        La La Land movie, chill, eat, watch movie,
        activity afterwards.
      </p>
    </button>
  </div>

  <div class="result" id="result" role="status" aria-live="polite"></div>
</main>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1536994083107766313/SY_1VddKyw8hp1nwVXH--uYtLKg8BrVFxX4GPYqkeuVG_tgXVnGZwH0vrBer1TMUq46T";

const result = document.getElementById("result");
const choiceButtons = document.querySelectorAll(".card[data-choice]");

choiceButtons.forEach((button) => {
  button.addEventListener("click", () => choose(button.dataset.choice));
});

async function choose(option) {
  const isRed = option === "Red Pill";
  const message = isRed ? "🔴 Red Pill selected." : "🔵 Blue Pill selected.";

  result.classList.remove("error");
  result.textContent = "Sending your choice...";
  choiceButtons.forEach((button) => button.disabled = true);

  try {
    const response = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username: "Choose Your Path",
        content: message
      })
    });

    if (!response.ok) {
      throw new Error(`Discord returned HTTP ${response.status}`);
    }

    result.textContent = isRed
      ? "🔴 You chose the Red Pill. Mystery awaits..."
      : "🔵 You chose the Blue Pill. Movie time!";
  } catch (error) {
    console.error("Webhook request failed:", error);
    result.classList.add("error");
    result.textContent = "Your choice is locked, but the message could not be sent.";
  }
}
</script>

</body>
</html>
